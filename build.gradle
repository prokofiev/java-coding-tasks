plugins {
  id 'java'
}

group = 'com.example'
version = '1.0.0'

java {
  sourceCompatibility = JavaVersion.VERSION_11
  targetCompatibility = JavaVersion.VERSION_11
}

repositories {
  mavenCentral()
}

dependencies {
  testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
}

test {
  useJUnitPlatform()
}